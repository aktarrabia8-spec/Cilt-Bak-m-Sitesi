<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SitemizBakımında | Çok Yakında !</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <h1>Sitemiz Bakımında</h1>
        <p>Yepyeni Arayüzümüz ile Çok yakında Hizmetinizde Olacağız</p>
        <div id="countdown-container">
            <div class="time-box">
                <span id="days">00</span>
                <p>Gün</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Saat</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Dakika</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Saniye</p>
            </div>
            <button onclick="mesajGoster()"> <strong>Bize Ulaşın </strong></button>
        </div>

        <script src="script.js"></script>
    </div>
</body>
</html>
